<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>demotopassAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a-scene {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: targets.mind;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- =========================
         動画
    ========================== -->
    <a-assets>

      <video
        id="demoVideo"
        src="demotopass.mov"
        preload="auto"
        loop
        playsinline
        webkit-playsinline>
      </video>

    </a-assets>


    <!-- =========================
         カメラ
    ========================== -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- =========================
         画像認識
    ========================== -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!--
        透過MOVを表示
        transparent: true で透明部分を有効化
      -->
      <a-video
        id="teacherVideo"
        src="#demoVideo"
        width="1"
        height="1.7778"
        position="0 0 0"
        material="shader: flat; transparent: true; alphaTest: 0.01;">
      </a-video>

    </a-entity>

  </a-scene>


  <!-- =========================
       JavaScript
  ========================== -->
  <script>

    const video = document.querySelector("#demoVideo");
    const teacherVideo = document.querySelector("#teacherVideo");

    /*
     * A-Frameの動画マテリアルを
     * 透明対応にする
     */
    teacherVideo.addEventListener("materialtextureloaded", () => {

      const mesh = teacherVideo.getObject3D("mesh");

      if (mesh && mesh.material) {
        mesh.material.transparent = true;
        mesh.material.alphaTest = 0.01;
        mesh.material.depthWrite = false;
        mesh.material.needsUpdate = true;
      }

    });


    /*
     * 画像を認識したら動画を読み込む
     */
    const scene = document.querySelector("a-scene");

    scene.addEventListener("targetFound", () => {

      console.log("先生の写真を認識しました");

      video.currentTime = 0;

    });


    /*
     * 画面をタップしたら
     * 音付きで動画再生
     */
    document.body.addEventListener("click", async () => {

      try {

        video.muted = false;

        await video.play();

        console.log("動画再生開始");

      } catch (error) {

        console.log("動画再生エラー:", error);

      }

    });


    /*
     * スマホのタッチ操作
     */
    document.body.addEventListener("touchstart", async () => {

      try {

        video.muted = false;

        await video.play();

        console.log("動画再生開始");

      } catch (error) {

        console.log("動画再生エラー:", error);

      }

    });

  </script>

</body>
</html>
